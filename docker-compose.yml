services:
  brix:
    build: .
    container_name: brix
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ${HOME}/.brix:/root/.brix
      - /root:/host/root                              # host filesystem access
      - ./src/brix:/app/src/brix                      # dev-mode: live code reload
      - brix-workdir:/root/brix-workdir               # persistent workdir (JSONL spill files)
    env_file: .env
    networks:
      - shared-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  brix-mcp:
    build: .
    container_name: brix-mcp
    command: >
      sh -c 'if [ "$$BRIX_MODE" = "mcp" ];
      then exec brix mcp --transport "$${BRIX_MCP_TRANSPORT:-stdio}" --host 0.0.0.0 --port 8091;
      else exec sleep infinity; fi'
    environment:
      - BRIX_MODE=mcp
      - BRIX_MCP_TRANSPORT=http
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /root:/host/root
      - ${HOME}/.brix:/root/.brix
      - ./src/brix:/app/src/brix                      # dev-mode: live code reload
      - brix-workdir:/root/brix-workdir               # persistent workdir (JSONL spill files)
    env_file: .env
    ports:
      - "8091:8091"
    networks:
      - shared-network
    stdin_open: true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  brix-api:
    build: .
    container_name: brix-api
    command: brix api --port 8090
    ports:
      - "8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /root:/host/root
      - ${HOME}/.brix:/root/.brix
      - ./src/brix:/app/src/brix                      # dev-mode: live code reload
      - brix-workdir:/root/brix-workdir               # persistent workdir (JSONL spill files)
    env_file: .env
    networks:
      - shared-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  shared-network:
    external: true

volumes:
  brix-workdir:  # persistent JSONL spill storage; replaces ephemeral /tmp/brix (BRIX_WORKDIR)
